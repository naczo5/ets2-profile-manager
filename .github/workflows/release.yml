name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ets2-profile-manager.sln -c Release --nologo
      - name: Zip build output
        shell: pwsh
        run: |
          $src = "ets2-profile-manager/bin/Release/net8.0-windows10.0.19041.0/win-x64"
          $stage = "release-stage"
          Copy-Item $src $stage -Recurse
          Get-ChildItem $stage -Recurse -Filter *.pdb | Remove-Item
          # Framework satellite translations: our UI is English-only and WinUI falls
          # back to English. Keep English + Polish, drop the other ~80 locales (~3 MB).
          Get-ChildItem $stage -Directory | Where-Object {
            $_.Name -match '^[a-z]{2}(-|$)' -and $_.Name -notin @('en', 'en-US', 'en-GB', 'pl-PL')
          } | Remove-Item -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "ets2-profile-manager-win-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: ets2-profile-manager-win-x64.zip
          generate_release_notes: true
